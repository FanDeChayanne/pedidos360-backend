spring.application.name=ms-notificaciones
server.port=8083

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# PROPIEDADES DE RABBITMQ
# Exchanges
rabbitmq.exchange.commands-direct=pedidos.commands.direct
rabbitmq.exchange.commands-topic=pedidos.commands.topic
rabbitmq.exchange.dead-letter=pedidos.commands.dead.dlx

# Colas principales
rabbitmq.queue.notification-email=pedidos.notify.email.q
rabbitmq.queue.notification-push=pedidos.notify.push.q
rabbitmq.queue.kitchen-ticket=pedidos.notify.ticket.q

# Dead Letter Queues
rabbitmq.queue.notification-email-dlq=pedidos.notify.email.dlq
rabbitmq.queue.notification-push-dlq=pedidos.notify.push.dlq
rabbitmq.queue.kitchen-ticket-dlq=pedidos.notify.ticket.dlq

# Routing keys de comandos
rabbitmq.routing.email=pedido.notificacion.email
rabbitmq.routing.push-binding=pedido.estado.*
rabbitmq.routing.ticket=pedido.ticket.cocina

# Routing keys hacia las DLQ
rabbitmq.routing.dlq-email=dlq.email
rabbitmq.routing.dlq-push=dlq.push
rabbitmq.routing.dlq-ticket=dlq.ticket