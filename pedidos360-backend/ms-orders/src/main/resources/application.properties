
spring.application.name=ms-orders

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8082}

# Conexión RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Exchanges y routing keys compartidos con ms-notificaciones
rabbitmq.exchange.commands-direct=pedidos.commands.direct
rabbitmq.exchange.commands-topic=pedidos.commands.topic
rabbitmq.routing.email=pedido.notificacion.email
rabbitmq.routing.push=pedido.estado
rabbitmq.routing.ticket=pedido.ticket.cocina

spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
