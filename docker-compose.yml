version: '3.8'

services:
  ms-catalog:
    build: ./ms-catalog
    container_name: ms-catalog
    env_file:
      - .env
    volumes:
      - ./wallet:/wallet:ro
    restart: unless-stopped

  ms-orders:
    build: ./ms-orders
    container_name: ms-orders
    env_file:
      - .env
    environment:
      CATALOG_SERVICE_URL: http://ms-catalog:8082
    volumes:
      - ./wallet:/wallet:ro
    depends_on:
      - ms-catalog
    restart: unless-stopped

  ms-bff:
    build: ./ms-bff
    container_name: ms-bff
    environment:
      ORDERS_SERVICE_URL: http://ms-orders:8081
      CATALOG_SERVICE_URL: http://ms-catalog:8082
    ports:
      - "80:8080"
    depends_on:
      - ms-orders
      - ms-catalog
    restart: unless-stopped

  ms-notificaciones:
    build: ./ms-notificaciones
    container_name: ms-notificaciones
    env_file:
      - .env
    expose:
      - "8083"
    restart: unless-stopped